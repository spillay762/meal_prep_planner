<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meal Prep Planner</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <h1>My Weekly Meal Prep Planner</h1>

        <p class="subtitle">
            Plan your lunches and dinners for the week.
        </p>

        <label for="servings">Number of Servings</label>

        <input
            type="number"
            id="servings"
            value="12"
            min="1"
        >

        <div class="meal-card">
            <h2>Lunch</h2>

            <p id="lunchMeal">
                Lunch meal ideas will appear here.
            </p>
        </div>

        <div class="meal-card">
            <h2>Dinner</h2>

            <p id="dinnerMeal">
                Dinner meal ideas will appear here.
            </p>
        </div>

        <button id="generateButton">
            Generate My Meals
        </button>

    </div>

    <script src="script.js"></script>

</body>

</html>
