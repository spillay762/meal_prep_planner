<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Weekly Meal Prep Planner</title>

    <!-- Connects the CSS styling file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <!-- Main heading -->
        <h1>My Weekly Meal Prep Planner</h1>

        <p class="subtitle">
            Plan your lunches and dinners for the week.
        </p>

        <!-- Servings section -->
        <div class="servings-section">

            <label for="servings">
                Number of Servings
            </label>

            <input
                type="number"
                id="servings"
                value="12"
                min="1"
                max="50"
            >

        </div>

        <!-- Lunch card -->
        <div class="meal-card">

            <h2>Lunch</h2>

            <p id="lunchMeal">
                Lunch meal ideas will appear here.
            </p>

            <p class="meal-info" id="lunchInfo">
                Click "Generate My Meals" to choose a lunch.
            </p>

        </div>

        <!-- Dinner card -->
        <div class="meal-card">

            <h2>Dinner</h2>

            <p id="dinnerMeal">
                Dinner meal ideas will appear here.
            </p>

            <p class="meal-info" id="dinnerInfo">
                Click "Generate My Meals" to choose a dinner.
            </p>

        </div>

        <!-- Generate button -->
        <button id="generateButton">
            Generate My Meals
        </button>

    </div>

    <!-- Connects the JavaScript file -->
    <script src="script.js"></script>

</body>

</html>
