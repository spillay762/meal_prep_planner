<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Meal Prep Planner</title>
</head>

<body>

    <h1>My Weekly Meal Prep Planner</h1>

    <p>Plan my lunches and dinners for the week.</p>

    <h2>Number of Servings</h2>

    <input type="number" value="10" min="1">

    <h2>Lunch</h2>

    <p>Lunch meal ideas will appear here.</p>

    <h2>Dinner</h2>

    <p>Dinner meal ideas will appear here.</p>

    <button>Generate My Meals</button>

</body>

</html>
